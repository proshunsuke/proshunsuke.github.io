<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>ページが見つかりません | pro_shunsuke</title>
    <link rel="icon" href="/favicons/favicon.ico" />
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #152239;
        background: #fff;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 720px;
        margin: 15vh auto;
      }
      .label {
        color: #2158c7;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.15em;
      }
      h1 {
        font-size: clamp(24px, 5vw, 36px);
        line-height: 1.5;
      }
      p {
        line-height: 1.8;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 0;
        color: #2158c7;
        text-underline-offset: 0.2em;
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #edf2fc;
          background: #111a29;
        }
        a,
        .label {
          color: #8db4ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404</p>
      <h1>ページが見つかりません</h1>
      <p>URLをご確認いただくか、ホームからページをお探しください。</p>
      <a href="/">ホームへ戻る</a>
    </main>
  </body>
</html>
