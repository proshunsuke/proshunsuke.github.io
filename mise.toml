[tools]
node = "24.21.0"

[tasks.install]
run = "npm ci"

[tasks."skills:list"]
run = "npm run skills:list"

[tasks."skills:update"]
run = "npm run skills:update"

[tasks.test]
run = "npm test"

[tasks."test:unit"]
run = "npm run test:unit"

[tasks."test:browser"]
run = "npm run test:browser"

[tasks."test:e2e"]
run = "npm run test:e2e"

[tasks."test:e2e:ui"]
run = "npm run test:e2e:ui"

[tasks."test:install"]
run = "npm run test:install"

[tasks.dev]
run = "npm run dev -- --host 127.0.0.1"

[tasks.build]
run = "npm run build"

[tasks.check]
run = "npm run check"

[tasks.preview]
run = "npm run preview -- --host 127.0.0.1"

[tasks."auth:check"]
dir = "workers/cms-auth"
run = ["npm ci", "npm run typecheck", "npm test", "npm run build", "npm run deploy -- --dry-run"]

[tasks.format]
run = "npm run format"

[tasks.lint]
run = "npm run lint"

[tasks."format:check"]
run = "npm run format:check"
