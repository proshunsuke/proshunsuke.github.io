name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare browser tests
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - run: mise run install
      - run: mise run lint
      - run: mise run format:check
      - run: npm run typecheck

  vitest:
    name: Vitest (Node and Browser)
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright-version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - run: mise run install
      - run: mise run test
      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics
          path: .vitest/attachments/
          include-hidden-files: true
          retention-days: 7

  worker-checks:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - run: mise run auth:check

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - run: mise run install
      - name: Build static site
        run: mise run build
        env:
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      - run: node scripts/verify-build.mjs
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: build/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E
    needs: [prepare, build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright-version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - run: mise run install
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: built-site
          path: build/client/
      - run: node scripts/verify-build.mjs
      - name: Test built site
        run: npm run test:e2e:built
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/client
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [static-checks, vitest, worker-checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "current=$([ "$current" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    name: Deploy Cloudflare Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [static-checks, vitest, worker-checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9
      - name: Build Worker
        working-directory: workers/cms-auth
        run: npm ci && npm run build
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "current=$([ "$current" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker
        if: steps.revision.outputs.current == 'true'
        working-directory: workers/cms-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required'; exit 1; }
          npm run deploy -- --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID"
      - name: Verify Worker
        if: steps.revision.outputs.current == 'true'
        working-directory: workers/cms-auth
        run: npm run verify:deployment
